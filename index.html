Generated: 2026-09-15 | Validated Total: 1,332,208 KWH

## 22 Production Rules (Bug-fix history included)

### Core Meter Extraction (Rules 1-6)
1. **METER_TABLE_REGEX**: \`/(\\d{7})\\s+(\\d+)\\s+(\\d{6,7})\\s+(\\d{6,7})\\s*(\\d+)?/g\`
   - Captures: MeterNo(7d), Multiplier, Previous(6-7d), Current(6-7d), Factor
   - Factor defaults to 1 if missing. Multiply delta * factor. CRITICAL: Do not apply factor twice.
   - Fixes fake-zero: previous bug used / (\\d+) \\s+ (\\d+) / which captured date as factor.

2. **GRAND_TOTAL_OVERRIDE**: \`/Grand Total Units Consumed\\s*[:]?\\s*([\\d,]+)/i\`
   - If found, use as primary KWH for Bulk bills. Meter sum must match within 0.5%.
   - Fixes 1,332,208.5 bug: old parser summed all meters * 10x factor incorrectly.
